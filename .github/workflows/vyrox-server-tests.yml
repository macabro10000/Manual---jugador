name: VyROX API tests

on:
  push:
    branches:
      - lab/universo-frontend
    paths:
      - "vyrox-server/**"
      - ".github/workflows/vyrox-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyrox-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate and commit lockfile only when absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(vyrox): add npm lockfile"
            git push
          fi
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
