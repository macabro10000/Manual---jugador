<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10111a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VyROX">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="description" content="VyROX: videos, noticias y descubrimientos en una experiencia móvil, dinámica e interactiva.">
  <title>VyROX — Descubre lo que se mueve</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="universe-app" id="universeApp">
    <header class="app-top">
      <a class="brand" href="#" aria-label="VyROX Principal"><span class="brand-orbit" aria-hidden="true"><span class="orbit-core">✦</span></span><span class="brand-word" aria-label="VyROX"><span class="brand-v">V</span><span class="brand-y">y</span><span>ROX</span><small>VIDEOS · NOTICIAS · ESTADOS</small></span></a>
      <div class="top-category" id="topCategory" aria-live="polite"><span class="category-spark">✦</span><span id="topCategoryName">Principal</span></div>
      <div class="top-status" id="feedStatus">VIDEOS PROPIOS</div>
      <button class="icon-button" id="searchToggle" aria-label="Buscar contenido">⌕</button>
    </header>
    <form class="search-panel" id="searchPanel" hidden>
      <input id="searchInput" type="search" placeholder="Buscar videos, noticias y temas…" aria-label="Buscar contenido">
      <button type="button" id="searchClose" aria-label="Cerrar búsqueda">×</button>
    </form>
    <section class="story-feed" id="storyFeed" aria-label="Contenido de VyROX">
      <div class="loading-state" id="loadingState">Preparando VyROX…</div>
    </section>
    <div class="screen-shade" aria-hidden="true"></div>
    <section class="bottom-drawer" id="bottomDrawer" aria-label="Menú de exploración">
      <button class="drawer-handle" id="drawerToggle" aria-expanded="false" aria-controls="drawerBody" aria-label="Abrir menú de pantallas">
        <span class="handle-line"></span><span class="handle-label" id="handleLabel">MENÚ · TOCA PARA EXPLORAR</span>
      </button>
      <div class="drawer-body" id="drawerBody" hidden>
        <div class="drawer-title-row"><div><strong>Explora VyROX</strong><small>Desliza a los lados para cambiar de pantalla</small></div><button class="icon-button drawer-close" id="drawerClose" aria-label="Cerrar menú">×</button></div>
        <nav class="menu-rail" id="menuRail" aria-label="Pantallas principales">
          <button class="menu-chip active" data-category="principal">▶ Principal · Videos</button>
          <button class="menu-chip" data-category="descubrimientos">▤ Noticias</button>
          <button class="menu-chip" data-category="estados">◉ Estados</button>
          <button class="menu-chip" data-category="guardados">♡ Guardados <span id="savedCount">0</span></button>
        </nav>
        <section class="device-connect" aria-label="Instalación en este teléfono">
          <div class="device-connect-copy"><strong>VyROX en tu teléfono</strong><small id="deviceStatus">Sin cuenta ni correo. Tus guardados se conservan en este dispositivo.</small></div>
          <button type="button" id="installAppButton" class="install-app-button">Instalar VyROX</button>
        </section>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
