name: VyROX API tests

on:
  push:
    branches:
      - lab/universo-frontend
    paths:
      - "vyrox-server/**"
      - ".github/workflows/vyrox-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyrox-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vyrox-server/package-lock.json
      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
